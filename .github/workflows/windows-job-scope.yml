name: Generic Windows Job scope probe
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: generic-windows-job-scope-probe
  cancel-in-progress: false
jobs:
  scope-probe:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - name: Run source-free native Job scope probe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expectedRepository = 'Smkzz/windows-native-prerequisite-probe'
          $identity = [ordered]@{
            repository = $env:GITHUB_REPOSITORY
            workflow_ref = $env:GITHUB_WORKFLOW_REF
            workflow_sha = $env:GITHUB_SHA
            run_id = $env:GITHUB_RUN_ID
            run_attempt = $env:GITHUB_RUN_ATTEMPT
            runner_os = $env:RUNNER_OS
            runner_arch = $env:RUNNER_ARCH
            runner_image = $env:ImageVersion
            scope = 'GENERIC_WINDOWS_JOB_CHILD_PRIMITIVE_ONLY'
            localcontrol_source_present = $false
            candidate_tests_executed = $false
            free_entitlement_verified = $false
            historical_job_cleanup = 'UNKNOWN'
            workflow_coordinator_in_owned_job = $false
            add_type_compiler_in_owned_job = $false
            runner_wrapper_in_owned_job = $false
            whole_run_cleanup_proven = $false
          }
          $probe = @'
          using System;
          using System.Collections.Generic;
          using System.ComponentModel;
          using System.Diagnostics;
          using System.IO;
          using System.Runtime.InteropServices;
          using System.Security.Cryptography;
          using System.Text;
          using System.Threading;

          public static class GenericWindowsJobScopeProbe
          {
              const uint CREATE_SUSPENDED = 0x00000004;
              const uint CREATE_NO_WINDOW = 0x08000000;
              const uint CREATE_UNICODE_ENVIRONMENT = 0x00000400;
              const uint STARTF_USESHOWWINDOW = 0x00000001;
              const uint JOB_OBJECT_LIMIT_ACTIVE_PROCESS = 0x00000008;
              const uint JOB_OBJECT_LIMIT_PROCESS_MEMORY = 0x00000100;
              const uint JOB_OBJECT_LIMIT_JOB_MEMORY = 0x00000200;
              const uint JOB_OBJECT_LIMIT_KILL_ON_JOB_CLOSE = 0x00002000;
              const uint HANDLE_FLAG_INHERIT = 0x00000001;
              const uint WAIT_OBJECT_0 = 0;
              const uint WAIT_TIMEOUT = 0x00000102;
              const uint INFINITE = 0xffffffff;
              const uint PROBE_EXIT = 0x0000c0de;
              const int ERROR_INSUFFICIENT_BUFFER = 122;
              const int JOB_OBJECT_EXTENDED_LIMIT_INFORMATION = 9;
              const int JOB_OBJECT_BASIC_ACCOUNTING_INFORMATION = 1;
              const int JOB_OBJECT_BASIC_PROCESS_ID_LIST = 3;
              const int PROCESS_ID_LIST_CAPACITY = 4;
              const long MAX_COORDINATOR_MS = 180000;
              const long MAX_CHILD_MS = 20000;
              const long MAX_WAIT_MS = 5000;
              const uint MEMORY_LIMIT = 268435456;

              [StructLayout(LayoutKind.Sequential)]
              struct SecurityAttributes
              {
                  public int Length;
                  public IntPtr SecurityDescriptor;
                  [MarshalAs(UnmanagedType.Bool)] public bool InheritHandle;
              }
              [StructLayout(LayoutKind.Sequential, CharSet = CharSet.Unicode)]
              struct StartupInfo
              {
                  public int Cb;
                  public IntPtr Reserved, Desktop, Title;
                  public uint X, Y, XSize, YSize, XChars, YChars, FillAttribute, Flags;
                  public ushort ShowWindow, Reserved2Count;
                  public IntPtr Reserved2, StdInput, StdOutput, StdError;
              }
              [StructLayout(LayoutKind.Sequential)]
              struct ProcessInfo { public IntPtr Process, Thread; public uint ProcessId, ThreadId; }
              [StructLayout(LayoutKind.Sequential)]
              struct BasicLimit
              {
                  public long PerProcessUserTime, PerJobUserTime;
                  public uint LimitFlags;
                  public UIntPtr MinimumWorkingSet, MaximumWorkingSet;
                  public uint ActiveProcessLimit;
                  public UIntPtr Affinity;
                  public uint PriorityClass, SchedulingClass;
              }
              [StructLayout(LayoutKind.Sequential)]
              struct IoCounters { public ulong ReadOps, WriteOps, OtherOps, ReadBytes, WriteBytes, OtherBytes; }
              [StructLayout(LayoutKind.Sequential)]
              struct ExtendedLimit
              {
                  public BasicLimit Basic;
                  public IoCounters Io;
                  public UIntPtr ProcessMemoryLimit, JobMemoryLimit, PeakProcessMemory, PeakJobMemory;
              }
              [StructLayout(LayoutKind.Sequential)]
              struct BasicAccounting
              {
                  public long TotalUserTime, TotalKernelTime, PeriodUserTime, PeriodKernelTime;
                  public uint PageFaults, TotalProcesses, ActiveProcesses, TerminatedProcesses;
              }
              sealed class ProbeFault : Exception
              {
                  public readonly string Code;
                  public readonly int Win32;
                  public ProbeFault(string code, int win32 = 0) : base(code) { Code = code; Win32 = win32; }
              }

              [DllImport("kernel32.dll", CharSet=CharSet.Unicode, SetLastError=true)]
              static extern IntPtr CreateJobObjectW(ref SecurityAttributes attributes, string name);
              [DllImport("kernel32.dll", SetLastError=true)]
              static extern bool SetInformationJobObject(IntPtr job, int infoClass, ref ExtendedLimit info, uint length);
              [DllImport("kernel32.dll", SetLastError=true)]
              static extern bool QueryInformationJobObject(IntPtr job, int infoClass, ref BasicAccounting info, uint length, out uint returned);
              [DllImport("kernel32.dll", SetLastError=true)]
              static extern bool QueryInformationJobObject(IntPtr job, int infoClass, IntPtr info, uint length, out uint returned);
              [DllImport("kernel32.dll", SetLastError=true)]
              static extern bool SetHandleInformation(IntPtr handle, uint mask, uint flags);
              [DllImport("kernel32.dll", SetLastError=true)]
              static extern bool GetHandleInformation(IntPtr handle, out uint flags);
              [DllImport("kernel32.dll", CharSet=CharSet.Unicode, SetLastError=true)]
              static extern bool CreateProcessW(string application, StringBuilder command, ref SecurityAttributes processAttributes,
                  ref SecurityAttributes threadAttributes, bool inheritHandles, uint creationFlags, IntPtr environment,
                  string currentDirectory, ref StartupInfo startup, out ProcessInfo processInfo);
              [DllImport("kernel32.dll", SetLastError=true)]
              static extern bool AssignProcessToJobObject(IntPtr job, IntPtr process);
              [DllImport("kernel32.dll", SetLastError=true)]
              static extern bool IsProcessInJob(IntPtr process, IntPtr job, out bool result);
              [DllImport("kernel32.dll", SetLastError=true)]
              static extern uint ResumeThread(IntPtr thread);
              [DllImport("kernel32.dll", SetLastError=true)]
              static extern bool TerminateProcess(IntPtr process, uint exitCode);
              [DllImport("kernel32.dll", SetLastError=true)]
              static extern uint WaitForSingleObject(IntPtr handle, uint milliseconds);
              [DllImport("kernel32.dll", SetLastError=true)]
              static extern bool GetExitCodeProcess(IntPtr process, out uint exitCode);
              [DllImport("kernel32.dll", SetLastError=true)]
              static extern bool CloseHandle(IntPtr handle);

              static readonly Stopwatch Clock = Stopwatch.StartNew();
              static readonly Dictionary<string, object> Receipt = new Dictionary<string, object>();
              static IntPtr Job = IntPtr.Zero;
              static ProcessInfo Child;
              static bool Assigned, TerminateProcessAttempted, CloseUncertain;
              static bool ProcessCloseAttempted, ThreadCloseAttempted, JobCloseAttempted;
              static bool FirstZeroActiveProof, FinalZeroActiveProof, CleanupProven;

              static void Need(bool ok, string code)
              {
                  if (!ok) throw new ProbeFault(code, Marshal.GetLastWin32Error());
              }
              static string Sha256(string path)
              {
                  using (SHA256 sha = SHA256.Create())
                  using (FileStream stream = File.OpenRead(path))
                  {
                      byte[] hash = sha.ComputeHash(stream);
                      StringBuilder text = new StringBuilder(hash.Length * 2);
                      foreach (byte b in hash) text.Append(b.ToString("x2"));
                      return text.ToString();
                  }
              }
              static string Quote(string value) { return "\"" + value.Replace("\"", "\\\"") + "\""; }
              static uint WaitBounded(IntPtr handle, uint requested)
              {
                  long remaining = MAX_COORDINATOR_MS - Clock.ElapsedMilliseconds;
                  if (remaining <= 0) throw new ProbeFault("COORDINATOR_DEADLINE");
                  return WaitForSingleObject(handle, (uint)Math.Min((long)requested, remaining));
              }
              static Dictionary<string, object> ProcessIdListSample()
              {
                  int headerBytes = 8;
                  int bytes = headerBytes + IntPtr.Size * PROCESS_ID_LIST_CAPACITY;
                  IntPtr buffer = Marshal.AllocHGlobal(bytes);
                  try
                  {
                      for (int i = 0; i < bytes; i++) Marshal.WriteByte(buffer, i, 0);
                      uint returned = 0;
                      bool ok = QueryInformationJobObject(Job, JOB_OBJECT_BASIC_PROCESS_ID_LIST,
                          buffer, (uint)bytes, out returned);
                      if (!ok) throw new ProbeFault("PROCESS_ID_LIST_QUERY_UNAVAILABLE", Marshal.GetLastWin32Error());
                      if (returned < headerBytes || returned > bytes)
                          throw new ProbeFault("PROCESS_ID_LIST_RETURN_LENGTH_INVALID");
                      uint assigned = unchecked((uint)Marshal.ReadInt32(buffer, 0));
                      uint count = unchecked((uint)Marshal.ReadInt32(buffer, 4));
                      if (count > PROCESS_ID_LIST_CAPACITY || count > assigned ||
                          returned < headerBytes + (int)count * IntPtr.Size)
                          throw new ProbeFault("PROCESS_ID_LIST_INCONSISTENT");
                      List<ulong> pids = new List<ulong>();
                      for (int i = 0; i < (int)count; i++)
                      {
                          IntPtr slot = new IntPtr(buffer.ToInt64() + headerBytes + (long)i * IntPtr.Size);
                          ulong pid = IntPtr.Size == 8
                              ? unchecked((ulong)Marshal.ReadInt64(slot))
                              : unchecked((uint)Marshal.ReadInt32(slot));
                          pids.Add(pid);
                      }
                      return new Dictionary<string, object> {
                          {"assigned_processes", assigned}, {"process_ids_returned", count},
                          {"process_id_list_capacity", PROCESS_ID_LIST_CAPACITY},
                          {"process_id_list_complete", count == assigned}, {"process_ids", pids}
                      };
                  }
                  finally { Marshal.FreeHGlobal(buffer); }
              }
              static Dictionary<string, object> AccountingSample()
              {
                  BasicAccounting sample = new BasicAccounting();
                  uint returned = 0;
                  bool ok = QueryInformationJobObject(Job, JOB_OBJECT_BASIC_ACCOUNTING_INFORMATION,
                      ref sample, (uint)Marshal.SizeOf(typeof(BasicAccounting)), out returned);
                  if (!ok) throw new ProbeFault("ACCOUNTING_QUERY_UNAVAILABLE", Marshal.GetLastWin32Error());
                  if (returned != (uint)Marshal.SizeOf(typeof(BasicAccounting))) throw new ProbeFault("ACCOUNTING_SIZE_MISMATCH");
                  Dictionary<string, object> pids = ProcessIdListSample();
                  return new Dictionary<string, object> {
                      {"accounting_available", true}, {"accounting_bytes", returned},
                      {"total_processes", sample.TotalProcesses}, {"active_processes", sample.ActiveProcesses},
                      {"terminated_processes", sample.TerminatedProcesses}, {"process_id_list", pids}, {"accounting_and_pid_list_atomic", false}
                  };
              }
              static Dictionary<string, object> AccountingStages = new Dictionary<string, object>();
              static Dictionary<string, object> CaptureAccountingStage(string name)
              {
                  Dictionary<string, object> sample = AccountingSample();
                  sample["elapsed_ms"] = Clock.ElapsedMilliseconds;
                  AccountingStages[name] = sample;
                  Receipt["accounting_stages"] = AccountingStages;
                  return sample;
              }
              static bool AccountingSampleMatches(Dictionary<string, object> sample, uint total, uint active, bool expectChild)
              {
                  if (sample == null || !(bool)sample["accounting_available"]) return false;
                  Dictionary<string, object> pidList = (Dictionary<string, object>)sample["process_id_list"];
                  List<ulong> pids = (List<ulong>)pidList["process_ids"];
                  bool expectedPidSet = expectChild
                      ? pids.Count == 1 && pids[0] == Child.ProcessId
                      : pids.Count == 0;
                  return (uint)sample["total_processes"] == total &&
                      (uint)sample["active_processes"] == active &&
                      (uint)sample["terminated_processes"] == 0 &&
                      (bool)pidList["process_id_list_complete"] &&
                      (uint)pidList["assigned_processes"] == (uint)pids.Count && expectedPidSet;
              }
              static bool StageMatches(string name, uint total, uint active, bool expectChild)
              {
                  object value;
                  if (!AccountingStages.TryGetValue(name, out value)) return false;
                  return AccountingSampleMatches((Dictionary<string, object>)value, total, active, expectChild);
              }
              static bool AccountingStagesMatchExpected()
              {
                  return StageMatches("empty_job", 0, 0, false) &&
                      StageMatches("child_created_suspended_before_assignment", 0, 0, false) &&
                      StageMatches("after_assignment_before_resume", 1, 1, true) &&
                      StageMatches("after_resume", 1, 1, true) &&
                      StageMatches("after_child_termination", 1, 0, false) &&
                      Receipt.ContainsKey("zero_active_processes_immediately_before_job_close") &&
                      AccountingSampleMatches((Dictionary<string, object>)Receipt["zero_active_processes_immediately_before_job_close"], 1, 0, false);
              }
              static Dictionary<string, object> ProveNoActiveMembers(uint budgetMs)
              {
                  Stopwatch local = Stopwatch.StartNew();
                  Dictionary<string, object> last = null;
                  while (local.ElapsedMilliseconds <= budgetMs && Clock.ElapsedMilliseconds < MAX_COORDINATOR_MS)
                  {
                      try
                      {
                          last = AccountingSample();
                          if ((uint)last["active_processes"] == 0 && (bool)((Dictionary<string, object>)last["process_id_list"])["process_id_list_complete"] && (uint)((Dictionary<string, object>)last["process_id_list"])["assigned_processes"] == 0) return last;
                      }
                      catch (ProbeFault) { }
                      Thread.Sleep(25);
                  }
                  Receipt["last_accounting_sample"] = last;
                  throw new ProbeFault("ZERO_ACTIVE_MEMBERS_NOT_PROVEN");
              }
              static void VerifyNonInheritable(IntPtr handle, string code)
              {
                  uint flags = 0;
                  Need(handle != IntPtr.Zero && GetHandleInformation(handle, out flags), code + "_QUERY");
                  Need((flags & HANDLE_FLAG_INHERIT) == 0, code + "_INHERITABLE");
              }
              static void ConfigureJob()
              {
                  SecurityAttributes attributes = new SecurityAttributes();
                  attributes.Length = Marshal.SizeOf(typeof(SecurityAttributes));
                  attributes.InheritHandle = false;
                  Job = CreateJobObjectW(ref attributes, null);
                  Need(Job != IntPtr.Zero, "JOB_CREATE_FAILED");
                  Need(SetHandleInformation(Job, HANDLE_FLAG_INHERIT, 0), "JOB_INHERITANCE_CLEAR_FAILED");
                  VerifyNonInheritable(Job, "JOB_HANDLE");
                  ExtendedLimit limits = new ExtendedLimit();
                  limits.Basic.LimitFlags = JOB_OBJECT_LIMIT_KILL_ON_JOB_CLOSE |
                      JOB_OBJECT_LIMIT_ACTIVE_PROCESS | JOB_OBJECT_LIMIT_PROCESS_MEMORY | JOB_OBJECT_LIMIT_JOB_MEMORY;
                  limits.Basic.ActiveProcessLimit = 1;
                  limits.ProcessMemoryLimit = new UIntPtr(MEMORY_LIMIT);
                  limits.JobMemoryLimit = new UIntPtr(MEMORY_LIMIT);
                  Need(SetInformationJobObject(Job, JOB_OBJECT_EXTENDED_LIMIT_INFORMATION,
                      ref limits, (uint)Marshal.SizeOf(typeof(ExtendedLimit))), "JOB_LIMITS_REFUSED");
                  Receipt["job_handle_unique_unnamed"] = true;
                  Receipt["job_handle_inheritable"] = false;
                  Receipt["job_active_process_limit"] = 1;
                  Receipt["job_process_memory_limit_bytes"] = MEMORY_LIMIT;
                  Receipt["job_memory_limit_bytes"] = MEMORY_LIMIT;
              }
              static void LaunchChild()
              {
                  string system = Environment.GetEnvironmentVariable("SystemRoot");
                  Need(!String.IsNullOrEmpty(system), "SYSTEMROOT_UNAVAILABLE");
                  string executable = Path.Combine(system, "System32", "WindowsPowerShell", "v1.0", "powershell.exe");
                  Need(File.Exists(executable), "FIXED_CHILD_EXECUTABLE_UNAVAILABLE");
                  string childCommand = Quote(executable) + " -NoLogo -NoProfile -NonInteractive -WindowStyle Hidden -Command " +
                      Quote("[System.Threading.Thread]::Sleep(20000)");
                  string drive = Path.GetPathRoot(system).TrimEnd('\\');
                  string[] entries = new string[] {
                      "PATH=" + Path.Combine(system, "System32"), "SYSTEMDRIVE=" + drive,
                      "SYSTEMROOT=" + system, "TEMP=" + Path.Combine(system, "Temp"),
                      "TMP=" + Path.Combine(system, "Temp"), "WINDIR=" + system
                  };
                  Array.Sort(entries, StringComparer.OrdinalIgnoreCase);
                  IntPtr environment = Marshal.StringToHGlobalUni(String.Join("\0", entries) + "\0\0");
                  try
                  {
                      SecurityAttributes processAttributes = new SecurityAttributes();
                      processAttributes.Length = Marshal.SizeOf(typeof(SecurityAttributes));
                      processAttributes.InheritHandle = false;
                      SecurityAttributes threadAttributes = processAttributes;
                      StartupInfo startup = new StartupInfo();
                      startup.Cb = Marshal.SizeOf(typeof(StartupInfo));
                      startup.Flags = STARTF_USESHOWWINDOW;
                      startup.ShowWindow = 0;
                      bool created = CreateProcessW(executable, new StringBuilder(childCommand),
                          ref processAttributes, ref threadAttributes, false,
                          CREATE_SUSPENDED | CREATE_NO_WINDOW | CREATE_UNICODE_ENVIRONMENT,
                          environment, Path.Combine(system, "System32"), ref startup, out Child);
                      if (!created) throw new ProbeFault("CHILD_CREATE_FAILED", Marshal.GetLastWin32Error());
                      Receipt["child_created_suspended"] = true;
                      Receipt["child_no_window"] = true;
                      Receipt["child_executable_sha256"] = Sha256(executable);
                      Receipt["child_pid"] = Child.ProcessId;
                      VerifyNonInheritable(Child.Process, "CHILD_PROCESS_HANDLE");
                      VerifyNonInheritable(Child.Thread, "CHILD_THREAD_HANDLE");
                          CaptureAccountingStage("child_created_suspended_before_assignment");
                      Need(AssignProcessToJobObject(Job, Child.Process), "CHILD_ASSIGNMENT_FAILED");
                      Assigned = true;
                      bool inside = false;
                      Need(IsProcessInJob(Child.Process, Job, out inside) && inside, "CHILD_JOB_MEMBERSHIP_FAILED");
                      Receipt["child_assignment_before_resume"] = true;
                      CaptureAccountingStage("after_assignment_before_resume");
                      uint priorSuspendCount = ResumeThread(Child.Thread);
                      Need(priorSuspendCount == 1, "CHILD_RESUME_STATE_UNEXPECTED");
                      Receipt["child_resumed_after_assignment"] = true;
                      CaptureAccountingStage("after_resume");
                      Need(WaitBounded(Child.Process, 250) == WAIT_TIMEOUT, "CHILD_NOT_ALIVE_FOR_PROBE");
                  }
                  finally { Marshal.FreeHGlobal(environment); }
              }
              static bool Signaled(IntPtr handle)
              {
                  if (handle == IntPtr.Zero) return false;
                  uint result = WaitForSingleObject(handle, 0);
                  if (result == WAIT_OBJECT_0) return true;
                  if (result == WAIT_TIMEOUT) return false;
                  throw new ProbeFault("OWNED_HANDLE_WAIT_FAILED", Marshal.GetLastWin32Error());
              }
              static void CloseChecked(ref IntPtr handle, string name)
              {
                  if (handle == IntPtr.Zero) return;
                  if (name == "process") { if (ProcessCloseAttempted) throw new ProbeFault("PROCESS_CLOSE_RETRY_REFUSED"); ProcessCloseAttempted = true; }
                  else if (name == "thread") { if (ThreadCloseAttempted) throw new ProbeFault("THREAD_CLOSE_RETRY_REFUSED"); ThreadCloseAttempted = true; }
                  else { if (JobCloseAttempted) throw new ProbeFault("JOB_CLOSE_RETRY_REFUSED"); JobCloseAttempted = true; }
                  bool closed = CloseHandle(handle);
                  Receipt["close_" + name + "_checked"] = true;
                  Receipt["close_" + name + "_succeeded"] = closed;
                  if (!closed)
                  {
                      CloseUncertain = true;
                      throw new ProbeFault("CHECKED_HANDLE_CLOSE_FAILED", Marshal.GetLastWin32Error());
                  }
                  handle = IntPtr.Zero;
              }
              static void CloseAfterZeroProof()
              {
                  if (CloseUncertain) return;
                  if (Child.Process != IntPtr.Zero)
                  {
                      Need(Signaled(Child.Process), "PROCESS_EXIT_NOT_PROVEN");
                      uint code = 0;
                      Need(GetExitCodeProcess(Child.Process, out code), "PROCESS_EXIT_CODE_UNAVAILABLE");
                      Receipt["child_exit_code"] = code;
                      Need(code == PROBE_EXIT, "OWNED_CHILD_EXIT_CODE_UNEXPECTED");
                  }
                  if (Child.Thread != IntPtr.Zero) Need(Signaled(Child.Thread), "THREAD_EXIT_NOT_PROVEN");
                  Dictionary<string, object> before = ProveNoActiveMembers(2000);
                  FirstZeroActiveProof = true;
                  Receipt["zero_active_processes_before_any_close"] = before;
                  CloseChecked(ref Child.Process, "process");
                  CloseChecked(ref Child.Thread, "thread");
                  Dictionary<string, object> beforeJobClose = ProveNoActiveMembers(1000);
                  FinalZeroActiveProof = true;
                  Receipt["zero_active_processes_immediately_before_job_close"] = beforeJobClose;
                  CloseChecked(ref Job, "job");
                  CleanupProven = true;
                  Receipt["cleanup_status"] = "OWNED_JOB_CHILD_PROVEN";
              }
              static void EmergencyCleanup()
              {
                  if (CloseUncertain) { Receipt["cleanup_status"] = "UNKNOWN_CHECKED_CLOSE"; return; }
                  if (Job == IntPtr.Zero) {
                      if (Child.Process == IntPtr.Zero && Child.Thread == IntPtr.Zero) { CleanupProven = true; Receipt["cleanup_status"] = "NO_NATIVE_OBJECTS"; }
                      else Receipt["cleanup_status"] = "UNKNOWN_JOB_HANDLE_MISSING";
                      return;
                  }
                  try
                  {
                      bool processKnown = Child.Process != IntPtr.Zero;
                      bool childSignaled = processKnown && Signaled(Child.Process);
                      Dictionary<string, object> initialPidList = ProcessIdListSample();
                      Receipt["emergency_initial_job_process_id_list"] = initialPidList;
                      List<ulong> initialPids = (List<ulong>)initialPidList["process_ids"];
                      bool listComplete = (bool)initialPidList["process_id_list_complete"] &&
                          (uint)initialPidList["assigned_processes"] == (uint)initialPids.Count;
                      bool onlyOwnedChild = processKnown && initialPids.Count == 1 && initialPids[0] == Child.ProcessId;
                      bool emptyJob = initialPids.Count == 0;
                      if (!listComplete || (!onlyOwnedChild && !emptyJob))
                          throw new ProbeFault("EMERGENCY_JOB_MEMBER_IDENTITY_UNKNOWN");
                      if (processKnown && !childSignaled)
                      {
                          Need(!TerminateProcessAttempted, "EMERGENCY_PROCESS_TERMINATION_ALREADY_ATTEMPTED");
                          TerminateProcessAttempted = true;
                          bool stopped = TerminateProcess(Child.Process, PROBE_EXIT);
                          Receipt["emergency_terminate_owned_process_succeeded"] = stopped;
                          Need(stopped, "EMERGENCY_OWNED_PROCESS_TERMINATION_FAILED");
                          Need(WaitBounded(Child.Process, (uint)MAX_WAIT_MS) == WAIT_OBJECT_0, "EMERGENCY_PROCESS_EXIT_UNKNOWN");
                      }
                      if (Child.Thread != IntPtr.Zero)
                          Need(WaitBounded(Child.Thread, (uint)MAX_WAIT_MS) == WAIT_OBJECT_0, "EMERGENCY_THREAD_EXIT_UNKNOWN");
                      Dictionary<string, object> sample = ProveNoActiveMembers(2000);
                      Receipt["emergency_zero_active_processes_before_close"] = sample;
                      FirstZeroActiveProof = true;
                      CloseChecked(ref Child.Process, "process");
                      CloseChecked(ref Child.Thread, "thread");
                      Dictionary<string, object> last = ProveNoActiveMembers(1000);
                      FinalZeroActiveProof = true;
                      Receipt["emergency_zero_active_processes_immediately_before_job_close"] = last;
                      CloseChecked(ref Job, "job");
                      CleanupProven = true;
                      Receipt["cleanup_status"] = "OWNED_JOB_CHILD_CLEANED_AFTER_SCOPE_FAILURE";
                  }
                  catch (ProbeFault fault)
                  {
                      Receipt["cleanup_status"] = "UNKNOWN_RETAINED_HANDLES_UNTIL_RUNNER_DISPOSAL";
                      Receipt["cleanup_failure_code"] = fault.Code;
                      if (fault.Win32 != 0) Receipt["cleanup_win32_error"] = fault.Win32;
                  }
                  catch
                  {
                      Receipt["cleanup_status"] = "UNKNOWN_RETAINED_HANDLES_UNTIL_RUNNER_DISPOSAL";
                      Receipt["cleanup_failure_code"] = "CLEANUP_UNEXPECTED_FAILURE";
                  }
              }
              public static Dictionary<string, object> Run(string repository, string workflowRef, string workflowSha,
                  string runId, string attempt, string runnerOs, string runnerArch, string imageVersion)
              {
                  Receipt["schema"] = "generic-windows-job-scope-receipt/v1";
                  Receipt["repository"] = repository;
                  Receipt["workflow_ref"] = workflowRef;
                  Receipt["workflow_sha"] = workflowSha;
                  Receipt["run_id"] = runId;
                  Receipt["run_attempt"] = attempt;
                  Receipt["runner_os"] = runnerOs;
                  Receipt["runner_arch"] = runnerArch;
                  Receipt["runner_image"] = imageVersion;
                  Receipt["runner_os_version"] = Environment.OSVersion.Version.ToString();
                  Receipt["coordinator_x64"] = Environment.Is64BitProcess;
                  Receipt["scope"] = "GENERIC_WINDOWS_JOB_CHILD_PRIMITIVE_ONLY";
                  Receipt["job_wide_termination_tested"] = false;
                  Receipt["owned_child_termination_method"] = "TerminateProcess_retained_process_handle_once";
                  Receipt["localcontrol_source_present"] = false;
                  Receipt["candidate_tests_executed"] = false;
                  Receipt["free_entitlement_verified"] = false;
                  Receipt["historical_job_cleanup"] = "UNKNOWN";
                  Receipt["workflow_coordinator_in_owned_job"] = false;
                  Receipt["add_type_compiler_in_owned_job"] = false;
                  Receipt["runner_wrapper_in_owned_job"] = false;
                  Receipt["whole_run_cleanup_proven"] = false;
                  Receipt["child_lifetime_ms"] = MAX_CHILD_MS;
                  Receipt["coordinator_limit_ms"] = MAX_COORDINATOR_MS;
                  Receipt["runner_timeout_minutes"] = 5;
                  Receipt["network_by_probe"] = false;
                  Receipt["third_party_actions"] = false;
                  string failure = null;
                  try
                  {
                      Need(Clock.ElapsedMilliseconds < MAX_COORDINATOR_MS, "COORDINATOR_DEADLINE");
                      Need(Environment.Is64BitProcess, "X64_COORDINATOR_REQUIRED");
                      ConfigureJob();
                      Receipt["job_nonce"] = Guid.NewGuid().ToString("N");
                      CaptureAccountingStage("empty_job");
                      LaunchChild();
                      Dictionary<string, object> beforeTerminationPids = ProcessIdListSample();
                      Receipt["pre_termination_job_process_id_list"] = beforeTerminationPids;
                      List<ulong> beforeTerminationIds = (List<ulong>)beforeTerminationPids["process_ids"];
                      Need((bool)beforeTerminationPids["process_id_list_complete"] &&
                          (uint)beforeTerminationPids["assigned_processes"] == (uint)beforeTerminationIds.Count &&
                          beforeTerminationIds.Count == 1 && beforeTerminationIds[0] == Child.ProcessId,
                          "PRE_TERMINATION_MEMBER_IDENTITY_UNKNOWN");
                      Need(!TerminateProcessAttempted, "OWNED_PROCESS_TERMINATION_ALREADY_ATTEMPTED");
                      TerminateProcessAttempted = true;
                      bool stopped = TerminateProcess(Child.Process, PROBE_EXIT);
                      Receipt["terminate_owned_process_succeeded"] = stopped;
                      Need(stopped, "OWNED_PROCESS_TERMINATION_FAILED");
                      Need(WaitBounded(Child.Process, (uint)MAX_WAIT_MS) == WAIT_OBJECT_0, "CHILD_EXIT_TIMEOUT");
                      Need(WaitBounded(Child.Thread, (uint)MAX_WAIT_MS) == WAIT_OBJECT_0, "CHILD_THREAD_EXIT_TIMEOUT");
                      CaptureAccountingStage("after_child_termination");
                      CloseAfterZeroProof();
                      bool accountingExpected = AccountingStagesMatchExpected();
                      Receipt["expected_lifetime_accounting_observed"] = accountingExpected;
                      failure = CleanupProven && FirstZeroActiveProof && FinalZeroActiveProof && !CloseUncertain && accountingExpected
                          ? null : (CleanupProven && !accountingExpected ? "UNEXPECTED_JOB_LIFETIME_ACCOUNTING" : "SCOPE_PROOF_INCOMPLETE");
                  }
                  catch (ProbeFault fault)
                  {
                      failure = fault.Code;
                      Receipt["failure_code"] = fault.Code;
                      if (fault.Win32 != 0) Receipt["win32_error"] = fault.Win32;
                  }
                  catch { failure = "UNEXPECTED_NATIVE_SCOPE_FAILURE"; Receipt["failure_code"] = failure; }
                  if (!CleanupProven) EmergencyCleanup();
                  bool accountingExpectedAtEnd = AccountingStagesMatchExpected();
                  Receipt["expected_lifetime_accounting_observed"] = accountingExpectedAtEnd;
                  if (!accountingExpectedAtEnd && failure == null) failure = "UNEXPECTED_JOB_LIFETIME_ACCOUNTING";
                  if (Clock.ElapsedMilliseconds >= MAX_COORDINATOR_MS && failure == null) failure = "COORDINATOR_DEADLINE";
                  Receipt["elapsed_ms"] = Clock.ElapsedMilliseconds;
                  Receipt["preclose_zero_active_processes_proven"] = FirstZeroActiveProof;
                  Receipt["final_preclose_zero_active_processes_proven"] = FinalZeroActiveProof;
                  Receipt["close_uncertain"] = CloseUncertain;
                  Receipt["owned_job_child_cleanup_proven"] = CleanupProven;
                  Receipt["status"] = failure == null && CleanupProven && FirstZeroActiveProof && FinalZeroActiveProof && !CloseUncertain
                      ? "PASS_OWNED_CHILD_JOB_SCOPE_ONLY" : (CleanupProven ? "FAIL_OWNED_CHILD_JOB_SCOPE_ONLY" : "FAIL_CLEANUP_UNKNOWN");
                  if (failure != null && !Receipt.ContainsKey("failure_code")) Receipt["failure_code"] = failure;
                  return Receipt;
              }
          }
          '@
          try {
            if ($env:GITHUB_EVENT_NAME -cne 'workflow_dispatch' -or $env:GITHUB_REPOSITORY -cne $expectedRepository -or $env:GITHUB_REF -cne 'refs/heads/main') { throw 'SCOPE_IDENTITY_REFUSED' }
            if ($env:GITHUB_SHA -notmatch '^[a-f0-9]{40}$' -or $env:GITHUB_RUN_ID -notmatch '^[0-9]+$' -or $env:GITHUB_RUN_ATTEMPT -cne '1') { throw 'RUN_IDENTITY_INVALID' }
            if ([string]::IsNullOrWhiteSpace($env:GITHUB_WORKFLOW_REF) -or $env:RUNNER_OS -cne 'Windows' -or $env:RUNNER_ARCH -cne 'X64' -or [string]::IsNullOrWhiteSpace($env:ImageVersion)) { throw 'RUNNER_IDENTITY_INCOMPLETE' }
            Add-Type -TypeDefinition $probe -Language CSharp -ErrorAction Stop
            $receipt = [GenericWindowsJobScopeProbe]::Run($identity.repository, $identity.workflow_ref, $identity.workflow_sha,
              $identity.run_id, $identity.run_attempt, $identity.runner_os, $identity.runner_arch, $identity.runner_image)
            $json = $receipt | ConvertTo-Json -Compress -Depth 8
            if ($json.Length -gt 100000) { throw 'RECEIPT_OUTPUT_LIMIT' }
            Write-Output $json
            if ($receipt.status -cne 'PASS_OWNED_CHILD_JOB_SCOPE_ONLY') { exit 1 }
          } catch {
            $failed = [ordered]@{
              schema = 'generic-windows-job-scope-receipt/v1'
              status = 'FAIL_SCOPE_SETUP'
              failure_code = 'IDENTITY_OR_HARNESS_SETUP_FAILED'
              repository = $env:GITHUB_REPOSITORY
              workflow_ref = $env:GITHUB_WORKFLOW_REF
              workflow_sha = $env:GITHUB_SHA
              run_id = $env:GITHUB_RUN_ID
              run_attempt = $env:GITHUB_RUN_ATTEMPT
              runner_os = $env:RUNNER_OS
              runner_arch = $env:RUNNER_ARCH
              runner_image = $env:ImageVersion
              scope = 'GENERIC_WINDOWS_JOB_CHILD_PRIMITIVE_ONLY'
              job_wide_termination_tested = $false
              owned_child_termination_method = 'TerminateProcess_retained_process_handle_once'
              localcontrol_source_present = $false
              candidate_tests_executed = $false
              free_entitlement_verified = $false
              historical_job_cleanup = 'UNKNOWN'
            workflow_coordinator_in_owned_job = $false
            add_type_compiler_in_owned_job = $false
            runner_wrapper_in_owned_job = $false
            whole_run_cleanup_proven = $false
            }
            $json = $failed | ConvertTo-Json -Compress -Depth 4
            if ($json.Length -le 100000) { Write-Output $json }
            exit 1
          }