name: Bounded LocalControl regression and MCP protocol
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: bounded-localcontrol-regression-mcp
  cancel-in-progress: false
jobs:
  bounded-regression-mcp:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - name: Verify frozen inputs and run selected regression and MCP checks
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_REPOSITORY -cne 'Smkzz/windows-native-prerequisite-probe'){throw 'REPOSITORY_MISMATCH'}
          if($env:GITHUB_EVENT_NAME -cne 'workflow_dispatch' -or $env:RUNNER_OS -cne 'Windows'){throw 'MANUAL_WINDOWS_ONLY'}
          if($env:GITHUB_SHA -notmatch '^[a-f0-9]{40}$'){throw 'COMMIT_ID_INVALID'}
          $root='C:\LocalControlRegressionMcp-'+[Guid]::NewGuid().ToString('N')
          if(Test-Path -LiteralPath $root){throw 'NEW_ROOT_REQUIRED'}
          $null=New-Item -ItemType Directory -Path $root
          $failed=$true
          function Plain-Path([string]$path) {
            $cursor=Get-Item -LiteralPath $path -Force
            while($null -ne $cursor) {
              if(($cursor.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0){throw 'REPARSE_PATH_REFUSED'}
              if($cursor -is [IO.FileInfo]){$cursor=$cursor.Directory}else{$cursor=$cursor.Parent}
            }
          }
          function Run-Captured([string]$exe,[string[]]$arguments,[int]$seconds,[string]$label) {
            $psi=[Diagnostics.ProcessStartInfo]::new()
            $psi.FileName=$exe
            $psi.UseShellExecute=$false
            $psi.CreateNoWindow=$true
            $psi.RedirectStandardOutput=$true
            $psi.RedirectStandardError=$true
            $psi.WorkingDirectory=$root
            $psi.Environment.Clear()
            foreach($name in @('SYSTEMROOT','WINDIR','SYSTEMDRIVE','LOCALAPPDATA','PATH','USERPROFILE')) {
              $value=[Environment]::GetEnvironmentVariable($name)
              if($null -ne $value){$psi.Environment[$name]=$value}
            }
            $psi.Environment['TEMP']=Join-Path $root 'temp'
            $psi.Environment['TMP']=Join-Path $root 'temp'
            $psi.Environment['PYTEST_DISABLE_PLUGIN_AUTOLOAD']='1'
            $psi.Environment['PYTHONDONTWRITEBYTECODE']='1'
            foreach($arg in $arguments){$psi.ArgumentList.Add($arg)}
            $process=[Diagnostics.Process]::new()
            $process.StartInfo=$psi
            try {
              if(-not $process.Start()){throw 'OWNED_PROCESS_START_FAILED'}
              $stdout=$process.StandardOutput.ReadToEndAsync()
              $stderr=$process.StandardError.ReadToEndAsync()
              if(-not $process.WaitForExit($seconds*1000)){
                $process.Kill($true);$process.WaitForExit()
                throw ('OWNED_PROCESS_TIMEOUT_'+$label)
              }
              $out=$stdout.GetAwaiter().GetResult()
              $err=$stderr.GetAwaiter().GetResult()
              if($out.Length -gt 2000000 -or $err.Length -gt 1000000){throw 'CAPTURE_BOUND_EXCEEDED'}
              [IO.File]::WriteAllText((Join-Path $root ($label+'.stdout.log')),$out)
              [IO.File]::WriteAllText((Join-Path $root ($label+'.stderr.log')),$err)
              if($process.ExitCode -ne 0){
                if($label -in @('COORDINATOR','PYTEST_LINK_CLEANUP') -and $out.Length -le 100000){Write-Host $out}
                [ordered]@{setup_stage=$label;exit_code=$process.ExitCode;stdout_characters=$out.Length;stderr_characters=$err.Length}|ConvertTo-Json -Compress|Write-Host
                throw ('OWNED_PROCESS_FAILED_'+$label)
              }
              return $out
            } finally {
              if($null -ne $process -and -not $process.HasExited){$process.Kill($true);$process.WaitForExit()}
              $process.Dispose()
            }
          }
          try {
            $base='https://raw.githubusercontent.com/Smkzz/windows-native-prerequisite-probe/'+$env:GITHUB_SHA+'/'
            $manifestPath=Join-Path $root 'SOURCE_MANIFEST.json'
            Invoke-WebRequest -Uri ($base+'pilot-source/REGRESSION_MCP_SOURCE_MANIFEST.json') -OutFile $manifestPath
            $manifestHash='949cda2e62cefd9bd1981c27c208bf7174f959211dff80ca58f4dde8cb874c58'
            if((Get-FileHash -LiteralPath $manifestPath -Algorithm SHA256).Hash.ToLowerInvariant() -cne $manifestHash){throw 'MANIFEST_HASH_MISMATCH'}
            $manifest=Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
            if($manifest.candidate_commit -cne 'e071dd2d099577e3ded081f1ffefd7c2bf22e3a8' -or
               $manifest.candidate_tree -cne '2afd017548b4ace8e2a7c67adebb6a5a9baeaf10' -or
               $manifest.files.Count -ne 92 -or $manifest.regression_nodes -ne 28){throw 'SOURCE_MANIFEST_DRIFT'}
            $sourceRoot=Join-Path $root 'source'
            $null=New-Item -ItemType Directory -Path $sourceRoot
            $null=New-Item -ItemType Directory -Path (Join-Path $root 'temp')
            $null=New-Item -ItemType Directory -Path (Join-Path $root 'runtime')
            $seen=[Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)
            foreach($file in $manifest.files) {
              if($file.path -notmatch '^pilot-source/((localcontrol|tests)/([a-zA-Z0-9_]+/)*[a-zA-Z0-9_]+\.py|(ownership_pilot|restart_pilot|regression_driver|server_entry|protocol_backend|server_mcp_probe)\.py|LimitedIoProbe\.cs|REGRESSION_SELECTION\.json|WHEELS\.json|requirements\.lock)$'){throw 'SOURCE_ALLOWLIST_PATH_REFUSED'}
              if(-not $seen.Add([string]$file.path)){throw 'DUPLICATE_SOURCE_PATH'}
              $target=[IO.Path]::GetFullPath((Join-Path $sourceRoot $file.path.Substring('pilot-source/'.Length)))
              if(-not $target.StartsWith($sourceRoot+'\',[StringComparison]::OrdinalIgnoreCase)){throw 'SOURCE_ESCAPE_REFUSED'}
              $null=[IO.Directory]::CreateDirectory([IO.Path]::GetDirectoryName($target))
              Invoke-WebRequest -Uri ($base+$file.path) -OutFile $target
              if((Get-Item -LiteralPath $target).Length -ne $file.bytes -or
                 (Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash.ToLowerInvariant() -cne $file.sha256){throw 'SOURCE_BYTES_MISMATCH'}
              Plain-Path $target
            }
            if(-not $env:RUNNER_TOOL_CACHE){throw 'INSTALLED_TOOL_CACHE_REQUIRED'}
            $cache=[IO.Path]::GetFullPath($env:RUNNER_TOOL_CACHE)
            $python=Join-Path $cache 'Python\3.12.10\x64\python.exe'
            $complete=Join-Path $cache 'Python\3.12.10\x64.complete'
            $compiler=Join-Path $env:SystemRoot 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
            foreach($path in @($python,$complete,$compiler)) {
              if(-not (Test-Path -LiteralPath $path -PathType Leaf)){throw 'PINNED_INSTALLED_TOOL_REQUIRED'}
              Plain-Path $path
            }
            $pythonHash=(Get-FileHash -LiteralPath $python -Algorithm SHA256).Hash.ToLowerInvariant()
            $compilerHash=(Get-FileHash -LiteralPath $compiler -Algorithm SHA256).Hash.ToLowerInvariant()
            if($pythonHash -cne '4d6f5f81a4bca11191c4c7c6b43632694d0a4ce74e068619d8fdc161d469859a' -or
               $compilerHash -cne '46809206887326d2d24db1eff1f3064de972c3451abe766b49111450a5e08e00'){throw 'PINNED_TOOL_HASH_DRIFT'}
            $wheels=Get-Content -LiteralPath (Join-Path $sourceRoot 'WHEELS.json') -Raw | ConvertFrom-Json
            if($wheels.wheel_count -ne 35 -or $wheels.total_bytes -ne 15688761){throw 'WHEEL_SET_DRIFT'}
            $wheelRoot=Join-Path $root 'wheels'
            $null=New-Item -ItemType Directory -Path $wheelRoot
            $wheelSeen=[Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)
            [long]$wheelBytes=0
            foreach($wheel in $wheels.files) {
              if($wheel.filename -notmatch '^[A-Za-z0-9_.+-]+\.whl$' -or -not $wheelSeen.Add([string]$wheel.filename)){throw 'WHEEL_FILENAME_REFUSED'}
              $uri=[Uri]$wheel.url
              if($uri.Scheme -cne 'https' -or $uri.Host -cne 'files.pythonhosted.org' -or $uri.UserInfo -or $uri.Query -or $uri.Fragment -or
                 $wheel.sha256 -notmatch '^[a-f0-9]{64}$' -or $wheel.bytes -lt 1 -or $wheel.bytes -gt 20000000){throw 'WHEEL_ORIGIN_OR_BOUND_REFUSED'}
              $target=Join-Path $wheelRoot $wheel.filename
              Invoke-WebRequest -Uri $uri -MaximumRedirection 0 -OutFile $target
              if((Get-Item -LiteralPath $target).Length -ne $wheel.bytes -or
                 (Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash.ToLowerInvariant() -cne $wheel.sha256){throw 'WHEEL_HASH_MISMATCH'}
              $wheelBytes+=$wheel.bytes
            }
            if($wheelSeen.Count -ne 35 -or $wheelBytes -ne 15688761){throw 'WHEEL_COUNT_OR_BYTES_MISMATCH'}
            $venv=Join-Path $root 'venv'
            $null=Run-Captured $python @('-I','-B','-m','venv',$venv) 30 'VENV'
            $venvPython=Join-Path $venv 'Scripts\python.exe'
            Plain-Path $venvPython
            $null=Run-Captured $venvPython @('-I','-B','-m','pip','--isolated','install','--no-index','--no-deps','--only-binary=:all:','--require-hashes','--no-cache-dir','--find-links',$wheelRoot,'-r',(Join-Path $sourceRoot 'requirements.lock')) 45 'OFFLINE_INSTALL'
            $null=Run-Captured $venvPython @('-I','-B','-m','pip','--isolated','check','--disable-pip-version-check') 15 'DEPENDENCY_CHECK'
            $compiled=Join-Path $root 'runtime\LimitedIoProbe.exe'
            $null=Run-Captured $compiler @('/nologo','/target:exe','/platform:x64',('/out:'+$compiled),(Join-Path $sourceRoot 'LimitedIoProbe.cs')) 15 'COMPILE'
            [ordered]@{workflow_commit=$env:GITHUB_SHA;candidate_commit=$manifest.candidate_commit;
              candidate_tree=$manifest.candidate_tree;source_manifest_sha256=$manifestHash;
              python_sha256=$pythonHash;compiler_sha256=$compilerHash;image_version=$env:ImageVersion;
              wheel_count=35;wheel_bytes=$wheelBytes;offline_dependency_check='PASS';
              full_release_qualification=$false;production_activation_authorized=$false}|ConvertTo-Json -Compress
            $out=Run-Captured $python @('-I','-B','-S','-X','utf8',(Join-Path $sourceRoot 'regression_driver.py'),$root) 180 'COORDINATOR'
            if($out.Length -gt 100000){throw 'COORDINATOR_OUTPUT_BOUND_EXCEEDED'}
            $out
            $last=($out.Trim() -split [Environment]::NewLine)[-1] | ConvertFrom-Json
            if($last.result -cne 'PASS_SELECTED_REGRESSION_AND_MCP_PROTOCOL_ONLY' -or
               $last.regression_tests -ne 28 -or $last.real_stdio_runtime_tools -ne 41 -or
               $last.schema_catalog_tools -ne 66){throw 'BOUNDED_REGRESSION_MCP_FAILED'}
            $failed=$false
          } finally {
            $resolved=[IO.Path]::GetFullPath($root)
            if($resolved -notmatch '^C:\\LocalControlRegressionMcp-[a-f0-9]{32}$'){throw 'CLEANUP_SCOPE_REFUSED'}
            # Enumerate metadata only, never descend into a reparse directory.
            # Only the exact four pytest links may be removed after a passing coordinator.
            $pending=[Collections.Generic.Queue[string]]::new()
            $rootItem=Get-Item -LiteralPath $resolved -Force
            if(($rootItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0){throw 'CLEANUP_ROOT_REPARSE_REFUSED'}
            $pending.Enqueue($resolved)
            $links=[Collections.Generic.List[object]]::new()
            $linkCount=0;$entryCount=0;$directoryCount=0;$complete=$true
            $clock=[Diagnostics.Stopwatch]::StartNew()
            while($pending.Count -gt 0 -and $complete) {
              $directory=$pending.Dequeue();$directoryCount++
              if($directoryCount -gt 4096 -or $clock.Elapsed.TotalSeconds -gt 10){$complete=$false;break}
              foreach($item in Get-ChildItem -LiteralPath $directory -Force -ErrorAction Stop) {
                $entryCount++
                if($entryCount -gt 16384 -or $clock.Elapsed.TotalSeconds -gt 10){$complete=$false;break}
                $path=[IO.Path]::GetFullPath($item.FullName)
                if(-not $path.StartsWith($resolved+'\',[StringComparison]::OrdinalIgnoreCase)){throw 'CLEANUP_INVENTORY_ESCAPE_REFUSED'}
                if(($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
                  $linkCount++
                  if($links.Count -lt 16) {
                    $relative=[IO.Path]::GetRelativePath($resolved,$path)
                    if($relative.Length -gt 256 -or $relative -match '[\x00-\x1f\x7f]'){$relative='BOUNDED_NAME_WITHHELD'}
                    $raw=[string]$item.LinkTarget
                    $targetClass='UNAVAILABLE';$relativeTarget=$null
                    if($raw -and $raw.Length -le 4096) {
                      try {
                        $target=[IO.Path]::GetFullPath($raw,[IO.Path]::GetDirectoryName($path))
                        if($target.StartsWith($resolved+'\',[StringComparison]::OrdinalIgnoreCase)){
                          $targetClass='LEXICALLY_INSIDE_OWNED_ROOT_NOT_FOLLOWED'
                          $relativeTarget=[IO.Path]::GetRelativePath($resolved,$target)
                          if($relativeTarget.Length -gt 256 -or $relativeTarget -match '[\x00-\x1f\x7f]'){$relativeTarget='BOUNDED_NAME_WITHHELD'}
                        } else {$targetClass='OUTSIDE_OWNED_ROOT_NOT_FOLLOWED'}
                      } catch {$targetClass='UNNORMALIZABLE_NOT_FOLLOWED'}
                    }
                    $hash=[Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($raw))).ToLowerInvariant()
                    $kind=if($item.LinkType -in @('SymbolicLink','Junction')){[string]$item.LinkType}else{'UNKNOWN_REPARSE_TYPE'}
                    $links.Add([ordered]@{path=$relative;attributes=[long]$item.Attributes;link_type=$kind;
                      reparse_tag='NOT_QUERIED';target_class=$targetClass;target_relative=$relativeTarget;target_sha256=$hash})
                  }
                  continue
                }
                if($item.PSIsContainer){$pending.Enqueue($path)}
              }
            }
            [ordered]@{cleanup_inventory_complete=$complete;entries_examined=$entryCount;directories_examined=$directoryCount;
              reparse_count=$linkCount;reparse_entries=@($links.ToArray());reparse_entries_truncated=($linkCount -gt 16);
              link_targets_followed=$false;general_link_deletion_authorized=$false}|ConvertTo-Json -Depth 6 -Compress
            if(-not $complete){throw 'CLEANUP_INVENTORY_BOUND_REFUSED'}
            if($linkCount -ne 4 -or $failed){throw 'CLEANUP_REPARSE_REFUSED'}
            # Only the four observed pytest-owned links, after a passing coordinator.
            $cleanupCode=@'
          import hashlib,json,os,re,stat,sys,time
          from pathlib import Path
          PROGRESS={"stage":"INITIALIZE","unlink_calls_returned":0}
          def need(value,reason):
              if not value:raise RuntimeError(reason)
          PAIRS={
           "test_cancellation_during_startcurrent":"test_cancellation_during_start0",
           "test_upstream_contract_mismatccurrent":"test_upstream_contract_mismatc0",
           "test_upstream_initialize_timeocurrent":"test_upstream_initialize_timeo0",
           "test_upstream_startup_retry_bucurrent":"test_upstream_startup_retry_bu0",
          }
          def identity(info):
              return (info.st_dev,info.st_ino,info.st_mode,info.st_size,info.st_mtime_ns,
                      info.st_file_attributes,getattr(info,"st_reparse_tag",0))
          FIELDS=("st_dev","st_ino","st_mode","st_size","st_mtime_ns","st_file_attributes","st_reparse_tag")
          METADATA={"cross_api_checks":0,"exe_mode_adjustments":0,"differences":[],"difference_records_truncated":False}
          def differing(path,left,right,phase):
              a,b=identity(left),identity(right)
              fields=[name for name,x,y in zip(FIELDS,a,b) if x!=y]
              record={"phase":phase,"different_fields":fields,
                      "left_values":{k:a[FIELDS.index(k)] for k in fields},
                      "right_values":{k:b[FIELDS.index(k)] for k in fields},
                      "suffix":".exe" if path.suffix.lower()==".exe" else "OTHER",
                      "filename_sha256":hashlib.sha256(path.name.encode()).hexdigest()}
              return fields,record
          def check_path_handle(path,path_info,handle_info):
              METADATA["cross_api_checks"]+=1
              fields,record=differing(path,path_info,handle_info,"PATH_VS_HANDLE")
              allowed=(fields==["st_mode"] and path.suffix.lower()==".exe" and
                       stat.S_ISREG(path_info.st_mode) and stat.S_ISREG(handle_info.st_mode) and
                       handle_info.st_mode&0o111==0 and path_info.st_mode==(handle_info.st_mode|0o111))
              if fields:
                  record["documented_exe_mode_adjustment"]=allowed
                  if len(METADATA["differences"])<4:METADATA["differences"].append(record)
                  else:METADATA["difference_records_truncated"]=True
              if fields and not allowed:METADATA["failure_difference"]=record
              need(not fields or allowed,"TARGET_OPEN_IDENTITY_DRIFT")
              if allowed:METADATA["exe_mode_adjustments"]+=1
          def check_handle_stability(path,before,after):
              fields,record=differing(path,before,after,"HANDLE_BEFORE_VS_AFTER_READ")
              if fields:METADATA["failure_difference"]=record
              need(not fields,"TARGET_READ_DRIFT")
          def ordinary(path,directory):
              info=os.lstat(path)
              need(not info.st_file_attributes&0x400 and getattr(info,"st_reparse_tag",0)==0,
                   "TARGET_OR_PARENT_REPARSE_REFUSED")
              need(stat.S_ISDIR(info.st_mode) if directory else stat.S_ISREG(info.st_mode),
                   "ORDINARY_NODE_TYPE_REQUIRED")
              need(info.st_ino!=0,"NATIVE_FILE_ID_REQUIRED")
              return info
          def link_identity(path,target):
              info=os.lstat(path)
              need(stat.S_ISLNK(info.st_mode) and info.st_file_attributes==1040 and
                   info.st_reparse_tag==0xA000000C,"EXACT_DIRECTORY_SYMLINK_REQUIRED")
              raw=os.readlink(path)
              if raw.startswith("\\\\?\\"):raw=raw[4:]
              need(os.path.isabs(raw) and os.path.normcase(raw)==
                   os.path.normcase(str(target)),"EXACT_LINK_TARGET_REQUIRED")
              return identity(info)
          def scan(root,expected):
              start=time.monotonic();pending=[root];found=set();entries=dirs=0
              while pending:
                  directory=pending.pop();ordinary(directory,True);dirs+=1
                  need(dirs<=4096,"SCAN_DIRECTORY_BOUND")
                  with os.scandir(directory) as stream:
                      for item in stream:
                          entries+=1
                          need(entries<=16384 and time.monotonic()-start<=10,"SCAN_ENTRY_OR_TIME_BOUND")
                          p=Path(item.path);info=os.lstat(p)
                          if info.st_file_attributes&0x400:
                              need(p in expected,"UNKNOWN_REPARSE_REFUSED");found.add(p)
                          elif stat.S_ISDIR(info.st_mode):pending.append(p)
                          else:need(stat.S_ISREG(info.st_mode),"UNKNOWN_NODE_REFUSED")
              need(found==set(expected),"EXACT_REPARSE_SET_REQUIRED")
              return entries
          def snapshot(target):
              start=time.monotonic();pending=[target];records=[];total=0
              while pending:
                  path=pending.pop()
                  need(len(records)<512 and time.monotonic()-start<=5,"TARGET_SNAPSHOT_BOUND")
                  info=os.lstat(path);directory=stat.S_ISDIR(info.st_mode)
                  ordinary(path,directory)
                  record=[path.relative_to(target).as_posix(),identity(info)]
                  if directory:
                      with os.scandir(path) as stream:
                          children=[Path(x.path) for x in stream]
                      need(len(children)<=512,"TARGET_CHILD_BOUND")
                      pending.extend(children)
                  else:
                      need(info.st_nlink==1,"TARGET_HARDLINK_REFUSED")
                      total+=info.st_size;need(total<=16*1024*1024,"TARGET_BYTES_BOUND")
                      with path.open("rb") as f:
                          opened=os.fstat(f.fileno())
                          check_path_handle(path,info,opened)
                          digest=hashlib.sha256()
                          while True:
                              block=f.read(65536)
                              if not block:break
                              need(f.tell()<=info.st_size and time.monotonic()-start<=5,"TARGET_READ_BOUND")
                              digest.update(block)
                          check_handle_stability(path,opened,os.fstat(f.fileno()))
                      record.append(digest.hexdigest())
                  records.append(record)
              return sorted(records)
          def cleanup(root):
              need(os.name=="nt" and sys.version_info[:3]==(3,12,10),"FIXED_WINDOWS_PYTHON_REQUIRED")
              need(re.fullmatch(r"C:\\LocalControlRegressionMcp-[a-f0-9]{32}",str(root)) is not None,
                   "FIXED_DISPOSABLE_ROOT_REQUIRED")
              parent=root/"regression-temp"
              root_id=identity(ordinary(root,True));parent_id=identity(ordinary(parent,True))
              expected={parent/link:parent/target for link,target in PAIRS.items()}
              PROGRESS["stage"]="VERIFY_EXACT_LINK_SET"
              scan(root,expected)
              links={p:link_identity(p,t) for p,t in expected.items()}
              PROGRESS["stage"]="SNAPSHOT_ALL_TARGETS"
              before={t:snapshot(t) for t in expected.values()}
              for path,target in expected.items():
                  # The successful coordinator has already stopped/proved all owned Jobs.
                  # Root/parent directory identity is checked again before each unlink.
                  now=identity(ordinary(root,True));up=identity(ordinary(parent,True))
                  need(now[:2]==root_id[:2] and up[:2]==parent_id[:2],"PARENT_IDENTITY_DRIFT")
                  need(link_identity(path,target)==links[path],"LINK_IDENTITY_DRIFT")
                  PROGRESS["stage"]="UNLINK_VERIFIED_OBJECT"
                  os.unlink(path)  # Windows directory-symlink branch removes the link object only.
                  PROGRESS["unlink_calls_returned"]+=1
                  need(not os.path.lexists(path),"LINK_STILL_PRESENT")
                  need(snapshot(target)==before[target],"TARGET_CHANGED_DURING_UNLINK")
              PROGRESS["stage"]="VERIFY_ALL_TARGETS_AND_RESCAN"
              after={t:snapshot(t) for t in expected.values()}
              need(before==after,"TARGET_SET_CHANGED_DURING_UNLINK")
              scanned=scan(root,{})
              return {"fixture_link_cleanup":"PASS","exact_links_removed":4,
                      "target_identity_metadata_and_content_unchanged_during_unlink":True,
                      "post_unlink_reparse_count":0,"post_unlink_entries_examined":scanned,
                      "target_snapshot_sha256":{t.name:hashlib.sha256(json.dumps(v,separators=(",",":")).encode()).hexdigest()
                                                for t,v in after.items()},
                      "ordinary_disposable_root_teardown_follows":True,"metadata_comparison":METADATA}
          if __name__=="__main__":
              try:
                  need(len(sys.argv)==2,"FIXED_ROOT_ARGUMENT_REQUIRED")
                  print(json.dumps(cleanup(Path(sys.argv[1])),sort_keys=True))
              except BaseException as error:
                  reason=str(error) if isinstance(error,RuntimeError) and re.fullmatch("[A-Z0-9_]+",str(error)) else "BOUNDED_LINK_CLEANUP_EXCEPTION"
                  print(json.dumps({"fixture_link_cleanup":"FAIL_OR_BLOCKED","reason":reason,"error_type":type(error).__name__,**PROGRESS,"metadata_comparison":METADATA}))
                  sys.exit(2)
          '@
            $unlinkOut=Run-Captured $python @('-I','-B','-S','-X','utf8','-c',$cleanupCode,$resolved) 30 'PYTEST_LINK_CLEANUP'
            if($unlinkOut.Length -gt 10000){throw 'LINK_CLEANUP_OUTPUT_BOUND'}
            $unlinkOut
            $unlinkReceipt=$unlinkOut.Trim() | ConvertFrom-Json
            if($unlinkReceipt.fixture_link_cleanup -cne 'PASS' -or $unlinkReceipt.exact_links_removed -ne 4 -or
               $unlinkReceipt.target_identity_metadata_and_content_unchanged_during_unlink -ne $true -or
               $unlinkReceipt.post_unlink_reparse_count -ne 0){throw 'EXACT_PYTEST_LINK_CLEANUP_FAILED'}
            # Targets were preserved by unlink; now dispose of the owned test root.
            [IO.Directory]::Delete($resolved,$true)
            Write-Output '{"runner_fixture_cleanup":"PASS"}'
          }
          if($failed){exit 1}

